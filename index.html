<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e6007e">
<title>make your dream world</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Unbounded:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#f4f1ff; --dim:#9d94c7; --accent:#b48cff; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#05010f; }
  body { font-family:'Poppins',-apple-system,sans-serif; color:var(--ink); height:100dvh; }
  #scene { position:fixed; inset:0; touch-action:none; }
  canvas { display:block; }

  /* ---------- landing ---------- */
  #landing { position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; background:linear-gradient(165deg,#ff2b5f 0%,#ec0a7e 34%,#a018d8 70%,#5a10b8 100%); transition:opacity .9s ease, transform .9s ease; }
  #landing.gone { opacity:0; transform:scale(1.12); pointer-events:none; }
  .aurora { position:absolute; border-radius:50%; filter:blur(90px); opacity:.35; animation:drift 14s ease-in-out infinite alternate; pointer-events:none; }
  .a1 { width:60vw; height:60vw; max-width:520px; max-height:520px; background:#ff7ab8; top:-12%; left:-14%; }
  .a2 { width:52vw; height:52vw; max-width:460px; max-height:460px; background:#6a1bb8; bottom:-10%; right:-12%; animation-delay:-6s; }
  .a3 { width:34vw; height:34vw; max-width:320px; max-height:320px; background:#ff3d6e; top:38%; left:62%; animation-delay:-3s; opacity:.28; }
  @keyframes drift { from { transform:translate(0,0) scale(1);} to { transform:translate(6vw,-4vh) scale(1.15);} }
  .l-inner { position:relative; width:100%; max-width:560px; text-align:center; }
  h1 { font-family:'Poppins',sans-serif; font-weight:800; font-size:clamp(36px,9.4vw,62px); line-height:1.04; letter-spacing:-.015em;
    color:#fff; text-shadow:0 4px 30px rgba(120,0,60,.35); }
  .spark { margin-top:14px; font-size:11.5px; font-weight:600; letter-spacing:.3em; color:rgba(255,255,255,.95); }
  #dream-form { margin-top:30px; }
  .prompt-card { display:flex; align-items:center; background:#fff; border-radius:26px; padding:7px 7px 7px 22px;
    box-shadow:0 0 0 3px rgba(255,255,255,.30), 0 16px 48px rgba(210,0,110,.5); }
  #dream-input { flex:1; min-width:0; border:none; outline:none; background:transparent; color:#1c0b2b;
    font-family:'Poppins'; font-size:16px; font-weight:500; padding:12px 8px 12px 0; }
  #dream-input::placeholder { color:#9b8cb0; font-weight:500; }
  #enter-btn { flex:none; width:46px; height:46px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(135deg,#ff2b5f,#c81ee8); color:#fff; font-size:20px; font-weight:700; line-height:1;
    box-shadow:0 6px 18px rgba(220,20,140,.55); transition:transform .15s; }
  #enter-btn:active { transform:scale(.9); }
  .chips { margin-top:24px; display:flex; flex-wrap:wrap; gap:9px; justify-content:center; }
  .chip { font-family:'Poppins'; font-size:12.5px; color:#fff; padding:8px 15px; border:1px solid rgba(255,255,255,.45); border-radius:999px;
    background:rgba(255,255,255,.08); cursor:pointer; transition:all .18s; }
  .chip:active { background:rgba(255,255,255,.22); border-color:#fff; }
  .freeline { margin-top:26px; font-size:10.5px; font-weight:600; letter-spacing:.26em; color:rgba(255,255,255,.85); }
  .foot { position:absolute; bottom:calc(18px + env(safe-area-inset-bottom)); font-size:11px; color:rgba(255,255,255,.78); letter-spacing:.04em; }

  /* ---------- transition ---------- */
  #veil { position:fixed; inset:0; z-index:40; background:#05010f; display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .45s ease; }
  #veil.on { opacity:1; pointer-events:auto; }
  .orb { width:86px; height:86px; border-radius:50%;
    background:radial-gradient(circle at 34% 32%, #fff, #ff9ad2 38%, #e6007e 70%, transparent 72%);
    animation:pulse 1.15s ease-in-out infinite; box-shadow:0 0 70px rgba(255,80,190,.75); }
  @keyframes pulse { 0%,100% { transform:scale(1);} 50% { transform:scale(1.22);} }
  #veil-text { margin-top:30px; font-family:'Unbounded'; font-weight:300; font-size:15px; color:var(--dim); letter-spacing:.12em; }

  /* ---------- HUD ---------- */
  #hud { position:fixed; inset:0; z-index:20; pointer-events:none; opacity:0; transition:opacity .8s ease .25s; }
  #hud.on { opacity:1; }
  #world-tag { position:absolute; top:calc(16px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:10px; padding:9px 16px; border-radius:999px;
    background:rgba(8,4,24,.55); border:1px solid rgba(180,140,255,.22); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
  #world-name { font-family:'Unbounded'; font-weight:500; font-size:12.5px; letter-spacing:.05em; white-space:nowrap; }
  #again-btn { pointer-events:auto; font-family:'Poppins'; font-size:11.5px; font-weight:600; color:#0b0424; background:linear-gradient(100deg,#e9dcff,#7fd8ff);
    border:none; border-radius:999px; padding:6px 12px; cursor:pointer; }
  #hint { position:absolute; bottom:calc(84px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    font-size:12.5px; color:rgba(244,241,255,.82); padding:9px 16px; border-radius:999px; white-space:nowrap;
    background:rgba(8,4,24,.5); border:1px solid rgba(255,255,255,.1); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    transition:opacity 1.2s ease; }
  #hint.gone { opacity:0; }
  #stick { position:absolute; width:112px; height:112px; border-radius:50%; border:1.5px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.05); display:none; pointer-events:none; }
  #nub { position:absolute; width:48px; height:48px; border-radius:50%; background:rgba(255,255,255,.38);
    left:32px; top:32px; box-shadow:0 0 18px rgba(180,140,255,.5); }
  #vignette { position:fixed; inset:0; z-index:10; pointer-events:none;
    background:radial-gradient(115% 100% at 50% 45%, transparent 58%, rgba(2,0,10,.55) 100%); }
  #err { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; text-align:center; padding:32px;
    background:#05010f; color:var(--dim); font-size:15px; line-height:1.6; }

  /* ---------- character chat ---------- */
  #chatwrap { position:absolute; left:0; right:0; bottom:calc(14px + env(safe-area-inset-bottom)); display:flex;
    flex-direction:column; gap:10px; padding:0 16px; pointer-events:none; }
  #chatlog { display:flex; flex-direction:column; gap:8px; }
  .msg { padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.42; max-width:84%; animation:msgin .35s ease; }
  @keyframes msgin { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:none;} }
  .msg.char { align-self:flex-start; background:rgba(12,6,28,.82); border:1px solid rgba(255,90,190,.38); color:#fff;
    border-bottom-left-radius:5px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  .msg.char .who { display:block; font-size:11.5px; font-weight:700; color:#ff8ad0; margin-bottom:3px; }
  .msg.me { align-self:flex-end; background:rgba(255,255,255,.93); color:#1c0b2b; border-bottom-right-radius:5px; }
  #chatbar { display:flex; align-items:center; background:rgba(255,255,255,.95); border-radius:999px; padding:5px 5px 5px 18px;
    pointer-events:auto; box-shadow:0 8px 26px rgba(0,0,0,.35); }
  #chat-input { flex:1; min-width:0; border:none; outline:none; background:transparent; font-family:'Poppins';
    font-size:14.5px; color:#1c0b2b; padding:8px 4px; }
  #chat-input::placeholder { color:#9b8cb0; }
  #chat-send { flex:none; width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(135deg,#ff2b5f,#c81ee8); color:#fff; font-size:17px; font-weight:700; line-height:1; }
</style>
</head>
<body>
<div id="scene"></div>
<div id="vignette"></div>

<div id="hud">
  <div id="world-tag"><span id="world-name"></span><button id="again-btn">new world</button></div>
  <div id="hint">drag to look &nbsp;&middot;&nbsp; left thumb to wander</div>
  <div id="stick"><div id="nub"></div></div>
  <div id="chatwrap">
    <div id="chatlog"></div>
    <form id="chatbar">
      <input id="chat-input" type="text" autocomplete="off" placeholder="say anything&hellip;">
      <button id="chat-send" type="submit" aria-label="send">&#8593;</button>
    </form>
  </div>
</div>

<div id="landing">
  <div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div>
  <canvas id="stars" style="display:none"></canvas>
  <div class="l-inner">
    <h1>make your<br>dream world</h1>
    <div class="spark">&#10022;&nbsp;&nbsp;THEN WALK AROUND IN IT&nbsp;&nbsp;&#10022;</div>
    <form id="dream-form">
      <div class="prompt-card">
        <input id="dream-input" type="text" autocomplete="off" placeholder="a neon city where it never stops raining&hellip;">
        <button id="enter-btn" type="submit" aria-label="step inside">&#8593;</button>
      </div>
    </form>
    <div class="chips" id="chips"></div>
    <div class="freeline">FREE DEMO &middot; RUNS IN YOUR BROWSER</div>
  </div>
  <div class="foot">made as a concept for simmy &#9829;</div>
</div>

<div id="veil"><div class="orb"></div><div id="veil-text">weaving your world</div></div>
<div id="err"></div>

<script>
// starfield on landing
(() => {
  const c = document.getElementById('stars'), x = c.getContext('2d');
  let w, h, s = [];
  const size = () => { w = c.width = innerWidth * devicePixelRatio; h = c.height = innerHeight * devicePixelRatio;
    s = Array.from({length: 130}, () => ({x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.4 + .3, p: Math.random()*6.28})); };
  size(); addEventListener('resize', size);
  (function tick(t) { x.clearRect(0,0,w,h);
    for (const st of s) { const a = .25 + .55 * Math.abs(Math.sin(t/1400 + st.p));
      x.fillStyle = 'rgba(220,205,255,' + a + ')'; x.beginPath(); x.arc(st.x, st.y, st.r * devicePixelRatio, 0, 6.29); x.fill(); }
    requestAnimationFrame(tick); })(0);
})();
</script>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/0.1.10/spark.module.js"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const isTouch = matchMedia('(pointer: coarse)').matches;
const err = (m) => { const e = document.getElementById('err'); e.style.display = 'flex'; e.textContent = m; };

let composer = null, bloom = null, renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) { err('This demo needs WebGL, which your browser has turned off.'); throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('scene').appendChild(renderer.domElement);

// bloom: load lazily, degrade gracefully
let bloomLib = null;
(async () => {
  try {
    const [{ EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }] = await Promise.all([
      import('three/addons/postprocessing/EffectComposer.js'),
      import('three/addons/postprocessing/RenderPass.js'),
      import('three/addons/postprocessing/UnrealBloomPass.js'),
      import('three/addons/postprocessing/OutputPass.js'),
    ]);
    bloomLib = { EffectComposer, RenderPass, UnrealBloomPass, OutputPass };
  } catch (e) { /* plain rendering fallback */ }
})();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.1, 900);
camera.position.set(0, 3, 24);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (composer) composer.setSize(innerWidth, innerHeight);
});

/* ---------------- helpers ---------------- */
const rand = (a, b) => a + Math.random() * (b - a);
const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), V = new THREE.Vector3(), S = new THREE.Vector3();
const EU = new THREE.Euler();
function setInst(im, i, x, y, z, ry, s, sy) {
  ry = ry || 0; s = s || 1; sy = (sy === undefined) ? s : sy;
  EU.set(0, ry, 0); Q.setFromEuler(EU); V.set(x, y, z); S.set(s, sy, s);
  M.compose(V, Q, S); im.setMatrixAt(i, M);
}
function glowSprite(size) {
  size = size || 64;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.35, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const softDot = glowSprite(64);

function makePoints(count, spread, size, color, opacity) {
  const g = new THREE.BufferGeometry();
  const p = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) { p[i*3] = rand(-spread, spread); p[i*3+1] = rand(-spread, spread); p[i*3+2] = rand(-spread, spread); }
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const m = new THREE.PointsMaterial({ size: size, color: color, map: softDot, transparent: true,
    opacity: opacity === undefined ? 0.9 : opacity,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true });
  return new THREE.Points(g, m);
}
// tiny deterministic noise for terrain
function n2(x, z) { const s = Math.sin(x * 12.9898 + z * 78.233) * 43758.5453; return s - Math.floor(s); }
function smoothNoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  return n2(xi, zi) * (1-u) * (1-v) + n2(xi+1, zi) * u * (1-v) + n2(xi, zi+1) * (1-u) * v + n2(xi+1, zi+1) * u * v;
}
function fbm(x, z) { return smoothNoise(x, z) * .6 + smoothNoise(x*2.3, z*2.3) * .3 + smoothNoise(x*5.1, z*5.1) * .1; }

/* ---------------- worlds ---------------- */
const WORLDS = {
  battle: {
  name: 'Duskfield of Two Hosts',
  build(root) {
    scene.fog = new THREE.Fog(0x38180c, 50, 300);
    scene.background = new THREE.Color(0x2c130b);
    root.add(new THREE.AmbientLight(0xff9d5c, 1.4));
    const sunL = new THREE.DirectionalLight(0xffb37d, 1.8); sunL.position.set(-70, 22, -30); root.add(sunL);
    const rim = new THREE.DirectionalLight(0xff5a3c, .7); rim.position.set(60, 14, 40); root.add(rim);

    // low sun on the horizon
    const sunSp = new THREE.Sprite(new THREE.SpriteMaterial({ map: softDot, color: 0xffcf7d, transparent: true, opacity: .95, blending: THREE.AdditiveBlending, depthWrite: false }));
    sunSp.scale.setScalar(90); sunSp.position.set(-150, 26, -110); root.add(sunSp);
    const sunCore = new THREE.Sprite(new THREE.SpriteMaterial({ map: softDot, color: 0xfff3d0, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false }));
    sunCore.scale.setScalar(34); sunCore.position.set(-150, 26, -108); root.add(sunCore);

    // scorched ground + trampled center strip
    const ground = new THREE.Mesh(new THREE.CircleGeometry(170, 40), new THREE.MeshStandardMaterial({ color: 0x5a3420, roughness: 1 }));
    ground.rotation.x = -Math.PI / 2; root.add(ground);
    const strip = new THREE.Mesh(new THREE.PlaneGeometry(26, 300), new THREE.MeshStandardMaterial({ color: 0x74452a, roughness: 1 }));
    strip.rotation.x = -Math.PI / 2; strip.position.y = .02; strip.rotation.z = Math.PI / 2; root.add(strip);

    // smoke columns behind each host
    const smokes = [];
    for (let i = 0; i < 10; i++) {
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: softDot, color: 0x241610, transparent: true, opacity: .5, depthWrite: false }));
      const side = i % 2 ? 1 : -1;
      sp.position.set(side * rand(30, 70), rand(8, 26), rand(-90, 90));
      sp.scale.set(rand(10, 18), rand(18, 30), 1); root.add(sp);
      smokes.push({ s: sp, p: Math.random() * 6.28, y0: sp.position.y });
    }

    // soldier sprite texture: spearman silhouette with shield
    function soldierTex(trim) {
      const c = document.createElement('canvas'); c.width = 96; c.height = 192;
      const x = c.getContext('2d');
      x.strokeStyle = trim; x.fillStyle = trim; x.lineWidth = 5; x.lineCap = 'round';
      x.beginPath(); x.moveTo(66, 8); x.lineTo(56, 128); x.stroke();              // spear
      x.beginPath(); x.moveTo(66, 8); x.lineTo(60, 22); x.lineTo(72, 22); x.closePath(); x.fill(); // spearhead
      x.beginPath(); x.arc(44, 40, 11, 0, 6.29); x.fill();                        // head
      x.beginPath(); x.moveTo(44, 52); x.lineTo(30, 108); x.lineTo(58, 108); x.closePath(); x.fill(); // body
      x.lineWidth = 7;
      x.beginPath(); x.moveTo(36, 106); x.lineTo(30, 152); x.stroke();            // legs
      x.beginPath(); x.moveTo(52, 106); x.lineTo(58, 152); x.stroke();
      x.beginPath(); x.moveTo(50, 62); x.lineTo(62, 76); x.stroke();              // spear arm
      x.beginPath(); x.ellipse(24, 84, 12, 20, .2, 0, 6.29); x.fill();            // shield
      const t = new THREE.CanvasTexture(c); return t;
    }
    const texA = soldierTex('#e8b34a'), texB = soldierTex('#b03328');   // gold host vs crimson host
    const p1 = new THREE.PlaneGeometry(1.9, 3.8); p1.rotateY(Math.PI / 4);
    const p2 = new THREE.PlaneGeometry(1.9, 3.8); p2.rotateY(-Math.PI / 4);
    const solGeo = mergeGeometries([p1, p2]);
    function hostMesh(tex) {
      return new THREE.InstancedMesh(solGeo, new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: .1, side: THREE.DoubleSide }), 170);
    }
    const hostA = hostMesh(texA), hostB = hostMesh(texB);
    root.add(hostA); root.add(hostB);
    const troopsA = [], troopsB = [];
    for (let i = 0; i < 170; i++) {
      const frontA = i < 60;
      troopsA.push({ x: frontA ? rand(-14, -5) : rand(-60, -15), z: rand(-80, 80), p: Math.random() * 6.28, f: frontA ? 1 : .35, s: rand(1.05, 1.28) });
      const frontB = i < 60;
      troopsB.push({ x: frontB ? rand(5, 14) : rand(15, 60), z: rand(-80, 80), p: Math.random() * 6.28, f: frontB ? 1 : .35, s: rand(1.05, 1.28) });
    }

    // banners - poles + waving cloth, gold and crimson
    const banners = [];
    for (let i = 0; i < 14; i++) {
      const side = i % 2 ? 1 : -1, col = i % 2 ? 0xb03328 : 0xe8b34a;
      const g = new THREE.Group();
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(.12, .12, 7, 5), new THREE.MeshStandardMaterial({ color: 0x2a1a10, roughness: .9 }));
      pole.position.y = 3.5; g.add(pole);
      const cloth = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.4, 6, 3), new THREE.MeshStandardMaterial({ color: col, side: THREE.DoubleSide, roughness: .8, emissive: col, emissiveIntensity: .3 }));
      cloth.position.set(1.25, 6, 0); g.add(cloth);
      g.position.set(side * rand(8, 55), 0, rand(-85, 85));
      root.add(g); banners.push({ g, cloth, p: Math.random() * 6.28 });
    }

    // arrows overhead - instanced darts on parabolic arcs
    const AN = 110;
    const arrows = new THREE.InstancedMesh(new THREE.BoxGeometry(.05, .05, 1.5), new THREE.MeshBasicMaterial({ color: 0x1c0f08 }), AN);
    root.add(arrows);
    const flights = [];
    function newFlight(a) {
      const dir = Math.random() < .5 ? 1 : -1;
      a.x0 = -dir * rand(20, 70); a.x1 = dir * rand(8, 60);
      a.z0 = rand(-85, 85); a.z1 = a.z0 + rand(-14, 14);
      a.peak = rand(14, 26); a.T = rand(1.6, 2.6); a.u = Math.random(); a.dir = dir;
    }
    for (let i = 0; i < AN; i++) { const a = {}; newFlight(a); flights.push(a); }

    // embers drifting
    const E = 320, ep = new Float32Array(E * 3);
    for (let i = 0; i < E; i++) { ep[i*3] = rand(-100, 100); ep[i*3+1] = rand(0, 26); ep[i*3+2] = rand(-100, 100); }
    const eGeo = new THREE.BufferGeometry(); eGeo.setAttribute('position', new THREE.BufferAttribute(ep, 3));
    const embers = new THREE.Points(eGeo, new THREE.PointsMaterial({ size: .3, color: 0xffa64d, map: softDot, transparent: true, opacity: .85, blending: THREE.AdditiveBlending, depthWrite: false }));
    root.add(embers);

    // campfires along the front - flickering glow
    const fires = [];
    for (let i = 0; i < 8; i++) {
      const f = new THREE.Sprite(new THREE.SpriteMaterial({ map: softDot, color: 0xff8c3a, transparent: true, opacity: .8, blending: THREE.AdditiveBlending, depthWrite: false }));
      f.scale.setScalar(rand(2.5, 4)); f.position.set(rand(-1, 1) * rand(6, 20), 1.2, rand(-70, 8));
      root.add(f); fires.push({ f, p: Math.random() * 6.28 });
    }

    // commander by the spawn - bigger gold figure, banner, glow
    const cmd = new THREE.Mesh(solGeo, new THREE.MeshBasicMaterial({ map: texA, transparent: true, alphaTest: .1, side: THREE.DoubleSide }));
    cmd.scale.setScalar(1.7); cmd.position.set(2.5, 2.9, 16); root.add(cmd);
    const cmdGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: softDot, color: 0xffc35c, transparent: true, opacity: .35, blending: THREE.AdditiveBlending, depthWrite: false }));
    cmdGlow.scale.setScalar(5); cmdGlow.position.set(2.5, 3.2, 16.5); root.add(cmdGlow);

    // story beats (position-triggered, fire once each, via chat overlay)
    const beats = [
      { x: 2.5, z: 16, r: 7, fired: false, line: 'steady, friend. the line holds because we hold it.' },
      { x: 0, z: -2, r: 6, fired: false, line: 'the horns! brace - the hosts meet!' },
      { x: 0, z: -52, r: 8, fired: false, line: 'from this ridge you can see both hosts entire. remember this sight.' },
    ];

    return {
      update(dt, t) {
        // soldiers: lunge + bob + sway; front ranks surge hardest
        for (let i = 0; i < 170; i++) {
          let a = troopsA[i], b = troopsB[i];
          const luA = Math.max(0, Math.sin(t * 1.9 + a.p)) * 1.6 * a.f;
          const luB = Math.max(0, Math.sin(t * 1.9 + b.p + 2.2)) * 1.6 * b.f;
          setInst(hostA, i, a.x + luA, 1.9 * a.s + Math.abs(Math.sin(t * 6 + a.p)) * .12, a.z, Math.sin(t * 3 + a.p) * .15, a.s);
          setInst(hostB, i, b.x - luB, 1.9 * b.s + Math.abs(Math.sin(t * 6 + b.p)) * .12, b.z, Math.sin(t * 3 + b.p) * .15, b.s);
        }
        hostA.instanceMatrix.needsUpdate = true; hostB.instanceMatrix.needsUpdate = true;
        // arrows
        for (let i = 0; i < AN; i++) {
          const a = flights[i]; a.u += dt / a.T; if (a.u > 1) newFlight(a);
          const u = a.u, x = a.x0 + (a.x1 - a.x0) * u, z = a.z0 + (a.z1 - a.z0) * u, y = 2 + a.peak * 4 * u * (1 - u);
          EU.set(0, Math.atan2(a.x1 - a.x0, a.z1 - a.z0), (1 - 2 * u) * .9); Q.setFromEuler(EU);
          V.set(x, y, z); S.set(1, 1, 1); M.compose(V, Q, S); arrows.setMatrixAt(i, M);
        }
        arrows.instanceMatrix.needsUpdate = true;
        // banners wave
        for (const b of banners) {
          const posA = b.cloth.geometry.attributes.position;
          for (let vi = 0; vi < posA.count; vi++) {
            const vx = posA.getX(vi);
            posA.setZ(vi, Math.sin(t * 5 + b.p + vx * 2) * .18 * (vx + 1.2) / 2.4);
          }
          posA.needsUpdate = true;
        }
        // embers drift up
        const pa = embers.geometry.attributes.position;
        for (let i = 0; i < E; i++) { let y = pa.getY(i) + dt * (1.2 + (i % 5) * .3); if (y > 28) y = 0; pa.setY(i, y); pa.setX(i, pa.getX(i) + Math.sin(t + i) * dt * .4); }
        pa.needsUpdate = true;
        for (const fr of fires) { fr.f.material.opacity = .55 + .3 * Math.abs(Math.sin(t * 7 + fr.p)); fr.f.scale.setScalar(fr.f.scale.x * (0.97 + 0.06 * Math.abs(Math.sin(t * 9 + fr.p)))); }
        // smoke pulses
        for (const sm of smokes) { sm.s.material.opacity = .38 + .14 * Math.sin(t * .5 + sm.p); sm.s.position.y = sm.y0 + Math.sin(t * .3 + sm.p) * 2; }
        // commander breathes
        cmdGlow.material.opacity = .28 + .1 * Math.sin(t * 2.2);
        // story beats
        if (charData && charData.name === 'commander rye') {
          for (const bt of beats) {
            if (!bt.fired && Math.hypot(pos.x - bt.x, pos.z - bt.z) < bt.r) { bt.fired = true; addMsg(bt.line, 'char', 'commander rye'); }
          }
        }
      }
    };
  }
},

ocean: {

    const RN = 170;
    const rocks = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 0), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .9 }), RN);
    const col = new THREE.Color();

      rocks.setColorAt(i, col.set(coralCols[i % 5]).multiplyScalar(rand(.5, 1))); }
    rocks.instanceMatrix.needsUpdate = true;
    if (rocks.instanceColor) rocks.instanceColor.needsUpdate = true;
    root.add(rocks);

    const WN = 120;
    const weed = new THREE.InstancedMesh(new THREE.ConeGeometry(.3, 6, 5), new THREE.MeshStandardMaterial({ color: 0x1d7a4f, roughness: 1 }), WN);
    const weeds = [];
    for (let i = 0; i < WN; i++) { const x = rand(-120, 120), z = rand(-120, 120);
      weeds.push({ x: x, y: hAt(x, z) + 3, z: z, s: rand(.6, 1.6), p: Math.random() * 6.28 }); }
    root.add(weed);

    const rays = [];
    for (let i = 0; i < 7; i++) {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(rand(6, 14), 90),
        new THREE.MeshBasicMaterial({ color: 0x9fe4ff, transparent: true, opacity: .05, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
      m.position.set(rand(-70, 70), 34, rand(-70, 70)); m.rotation.z = rand(-.25, .25); m.rotation.y = rand(0, 3.14);
      root.add(m); rays.push({ m: m, p: Math.random() * 6.28 });

    const bGeo = new THREE.BufferGeometry(); bGeo.setAttribute('position', new THREE.BufferAttribute(bp, 3));
    const bubbles = new THREE.Points(bGeo, new THREE.PointsMaterial({ size: .34, color: 0xcfefff, map: softDot, transparent: true, opacity: .7, depthWrite: false }));

    root.add(fish);

    return {
      update(dt, t) {
        for (let i = 0; i < WN; i++) { const w = weeds[i];
          EU.set(Math.sin(t * 1.1 + w.p) * .16, 0, Math.cos(t * .9 + w.p) * .16); Q.setFromEuler(EU);

          M.compose(V, Q, S); fish.setMatrixAt(i, M);

      { r: 4,  c: 0x6dffb2, p: [-40, 26, 40], ring: false },
    ];
    for (const d of pDefs) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(d.r, 32, 24), new THREE.MeshStandardMaterial({ color: d.c, roughness: .85 }));
      m.position.set(d.p[0], d.p[1], d.p[2]); root.add(m); planets.push({ m: m, s: rand(.02, .08) });
      const gl = new THREE.Sprite(new THREE.SpriteMaterial({ map: softDot, color: d.c, transparent: true, opacity: .35, blending: THREE.AdditiveBlending, depthWrite: false }));
      gl.scale.setScalar(d.r * 4.4); gl.position.copy(m.position); root.add(gl);
      if (d.ring) {
        const ring = new THREE.Mesh(new THREE.RingGeometry(d.r * 1.4, d.r * 2.1, 48),
          new THREE.MeshBasicMaterial({ color: 0xd8c9a0, transparent: true, opacity: .5, side: THREE.DoubleSide }));

      }
    }

    const AN = 160;
    const ast = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0), new THREE.MeshStandardMaterial({ color: 0x6b6b7d, roughness: 1 }), AN);
    const roids = [];
    for (let i = 0; i < AN; i++) roids.push({ x: rand(-140, 140), y: rand(-70, 90), z: rand(-140, 140),
      s: rand(.4, 3), rx: rand(0, 6.28), v: rand(.1, .5), p: Math.random() * 6.28 });
    root.add(ast);

    const K = 5, comets = [];
    const cMat = new THREE.MeshBasicMaterial({ color: 0xbfe8ff });
    for (let i = 0; i < K; i++) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(9, .1, .1), cMat);
      root.add(m); comets.push({ m: m, x: rand(-200, 200), y: rand(-60, 120), z: rand(-160, 60), v: rand(30, 60), wait: rand(0, 6) });
    }

    return {
      update(dt, t) {
        for (const p of planets) p.m.rotation.y += p.s * dt;
        for (let i = 0; i < AN; i++) { const r = roids[i];
          EU.set(t * r.v, r.rx + t * r.v * .7, 0); Q.setFromEuler(EU);
          V.set(r.x, r.y + Math.sin(t * .3 + r.p) * 4, r.z); S.set(r.s, r.s, r.s); M.compose(V, Q, S); ast.setMatrixAt(i, M); }
        ast.instanceMatrix.needsUpdate = true;
        for (const c of comets) {
          if (c.wait > 0) { c.wait -= dt; c.m.visible = false; continue; }
          c.m.visible = true; c.x += c.v * dt;
          if (c.x > 220) { c.x = -220; c.y = rand(-60, 120); c.z = rand(-160, 60); c.wait = rand(2, 8); }
          c.m.position.set(c.x, c.y, c.z); c.m.rotation.z = -.3; c.m.rotation.y = Math.PI / 2;
        }
      }
    };
  }
}

/* ---------------- genre classifier ---------------- */
const KEYS = {
  city:   ['city','neon','cyber','urban','tokyo','street','rain','future','metropolis','skyscraper','downtown','blade'],
  forest: ['forest','wood','tree','enchant','magic','fair','mushroom','jungle','nature','elf','moss','garden','grove'],
  ocean:  ['ocean','sea','water','reef','mermaid','atlantis','fish','coral','deep','underwater','dive','beach','wave'],
  desert: ['desert','sand','dune','egypt','pyramid','oasis','ruin','canyon','west','cactus','gold'],
  battle: ['battle','war','army','armies','siege','clash','legion','battlefield','banner','combat','warrior'],
  space:  ['space','galaxy','star','planet','cosmos','cosmic','nebula','asteroid','universe','mars','alien','void','orbit','drift','interstellar','floating'],
};
function classify(text) {
  const t = ' ' + text.toLowerCase() + ' ';
  let best = null, bestN = 0;
  for (const k of Object.keys(KEYS)) {
    const words = KEYS[k];
    let n = 0;
    for (const w of words) if (t.indexOf(w) !== -1) n += w.length;
    if (n > bestN) { bestN = n; best = k; }
  }
  if (best) return best;
  let h = 0; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0;
  return Object.keys(WORLDS)[h % 5];
}

    const d = Math.hypot(dx, dy), max = 46;
    if (d > max) { dx *= max / d; dy *= max / d; }

const endPointer = (e) => {

/* ---------------- world lifecycle ---------------- */
let current = null, root = null, flyMode = false;
let started = false, intro = 0;

function enterWorld(genre) {
  splatMode = false;
  currentGenre = genre;
  if (genre !== 'battle') stopWarAudio();
  if (splatMesh) { scene.remove(splatMesh); splatMesh.dispose && splatMesh.dispose(); splatMesh = null; }
  if (root) { scene.remove(root); root.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
  root = new THREE.Group();
  const w = WORLDS[genre];
  current = w.build(root);
  scene.add(root);
  flyMode = (genre === 'space' || genre === 'ocean');
  pos.set(0, flyMode ? 8 : 3, genre === 'battle' ? 30 : 26); yaw = 0; pitch = 0; intro = 1;
  document.getElementById('world-name').textContent = w.name;
  if (bloomLib && !composer) {
    composer = new bloomLib.EffectComposer(renderer);
    composer.addPass(new bloomLib.RenderPass(scene, camera));
    bloom = new bloomLib.UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), .55, .8, .82);
    composer.addPass(bloom);
    composer.addPass(new bloomLib.OutputPass());
  }
}

/* ---------------- main loop ---------------- */
const clock = new THREE.Clock();
const fwd = new THREE.Vector3(), rgt = new THREE.Vector3();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (!started) return;

  if (intro > 0) {
    intro = Math.max(0, intro - dt * .4);
    camera.position.set(pos.x, pos.y + intro * 14, pos.z + intro * 40);
    camera.lookAt(0, flyMode ? 8 : 4, 0);
    if (intro === 0) { yaw = 0; pitch = -.06; }
  } else {
    let mx = joystick.dx, mz = joystick.dy;
    if (keys['w'] || keys['arrowup']) mz -= 1;
    if (keys['s'] || keys['arrowdown']) mz += 1;
    if (keys['a'] || keys['arrowleft']) mx -= 1;
    if (keys['d'] || keys['arrowright']) mx += 1;
    const sp = splatMode ? 2.5 : (flyMode ? 16 : 11);
    const sin = Math.sin(yaw), cos = Math.cos(yaw);
    if (flyMode) {
      fwd.set(-sin * Math.cos(pitch), Math.sin(pitch), -cos * Math.cos(pitch));
      rgt.set(cos, 0, -sin);
      pos.addScaledVector(fwd, -mz * sp * dt);
      pos.addScaledVector(rgt, mx * sp * dt);
      pos.y = Math.max(-30, Math.min(90, pos.y));
    } else {
      pos.x += (-sin * -mz + cos * mx) * sp * dt;
      pos.z += (-cos * -mz - sin * mx) * sp * dt;
    }
    const d = Math.hypot(pos.x, pos.z);
    const maxR = splatMode ? splatMaxR : 150;
    if (d > maxR) { pos.x *= maxR / d; pos.z *= maxR / d; }
    if (splatMode && splatGroundFn) { const gyT = splatGroundFn(pos.x, pos.z) + 1.7; pos.y += (gyT - pos.y) * Math.min(1, dt * 5); }
    const moving = Math.abs(mx) + Math.abs(mz) > .05;
    const bob = moving ? Math.sin(t * 7) * .12 : Math.sin(t * 1.2) * .05;
    camera.position.set(pos.x, pos.y + (flyMode ? 0 : bob), pos.z);
    camera.rotation.set(0, 0, 0);
    camera.rotateY(yaw); camera.rotateX(pitch);
  }
  if (current) current.update(dt, t);
  if (composer && !splatMode) composer.render(); else renderer.render(scene, camera);
}
frame();


/* ---------------- war ambience (synth, gesture-gated) ---------------- */
let warCtx = null, warOn = false;
function startWarAudio() {
  if (warCtx) { warCtx.resume(); return; }
  try {
    warCtx = new (window.AudioContext || window.webkitAudioContext)();
    const master = warCtx.createGain(); master.gain.value = .14; master.connect(warCtx.destination);
    // murmur bed: filtered noise
    const len = warCtx.sampleRate * 2, buf = warCtx.createBuffer(1, len, warCtx.sampleRate), ch = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + .02 * w) / 1.02; ch[i] = last * 3.2; }
    const noise = warCtx.createBufferSource(); noise.buffer = buf; noise.loop = true;
    const nf = warCtx.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 420;
    const ng = warCtx.createGain(); ng.gain.value = .5;
    noise.connect(nf); nf.connect(ng); ng.connect(master); noise.start();
    // war drums
    function drum(when, f0) {
      const o = warCtx.createOscillator(), g = warCtx.createGain();
      o.frequency.setValueAtTime(f0, when); o.frequency.exponentialRampToValueAtTime(38, when + .18);
      g.gain.setValueAtTime(.9, when); g.gain.exponentialRampToValueAtTime(.001, when + .3);
      o.connect(g); g.connect(master); o.start(when); o.stop(when + .32);
    }
    let beat = 0;
    setInterval(() => { if (!warOn) return; const t0 = warCtx.currentTime; drum(t0, beat % 4 === 0 ? 82 : 64); beat++; }, 560);
    // distant horn swells
    function horn() {
      if (!warOn) return;
      const t0 = warCtx.currentTime, o = warCtx.createOscillator(), g = warCtx.createGain(), f = warCtx.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(98, t0); o.frequency.linearRampToValueAtTime(147, t0 + 1.6);
      f.type = 'lowpass'; f.frequency.value = 600;
      g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.16, t0 + 1.2); g.gain.exponentialRampToValueAtTime(.0001, t0 + 2.8);
      o.connect(f); f.connect(g); g.connect(master); o.start(t0); o.stop(t0 + 3);
      setTimeout(horn, 7000 + Math.random() * 9000);
    }
    setTimeout(horn, 2500);
    // rare metal clangs
    function clang() {
      if (!warOn) return;
      const t0 = warCtx.currentTime, o = warCtx.createOscillator(), g = warCtx.createGain(), f = warCtx.createBiquadFilter();
      o.type = 'square'; o.frequency.value = 700 + Math.random() * 700;
      f.type = 'bandpass'; f.frequency.value = o.frequency.value * 1.6; f.Q.value = 8;
      g.gain.setValueAtTime(.12, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + .22);
      o.connect(f); f.connect(g); g.connect(master); o.start(t0); o.stop(t0 + .25);
      setTimeout(clang, 1200 + Math.random() * 3200);
    }
    setTimeout(clang, 1500);
    warOn = true;
  } catch (e) { console.warn('audio unavailable', e); }
}
function stopWarAudio() { warOn = false; if (warCtx) warCtx.suspend(); }
addEventListener('pointerdown', () => { if (started && currentGenre === 'battle') { warOn = true; startWarAudio(); } });
addEventListener('keydown', () => { if (started && currentGenre === 'battle') { warOn = true; startWarAudio(); } });

/* ---------------- battle layer over a marble splat ----------------
   Same two-hosts clash as the prebaked Duskfield, compressed to a marble
   diorama's footprint and conformed to the splat's collider terrain. */
function buildBattleOnSplat(root, groundY, gy0) {
  root.add(new THREE.AmbientLight(0xffd9b0, 1.25));
  const sunL = new THREE.DirectionalLight(0xffb37d, 1.6); sunL.position.set(-30, 25, -14); root.add(sunL);
  const rim = new THREE.DirectionalLight(0xff5a3c, .6); rim.position.set(28, 12, 20); root.add(rim);

  function soldierTex(trim) {
    const c = document.createElement('canvas'); c.width = 96; c.height = 192;
    const x = c.getContext('2d');
    x.strokeStyle = trim; x.fillStyle = trim; x.lineWidth = 5; x.lineCap = 'round';
    x.beginPath(); x.moveTo(66, 8); x.lineTo(56, 128); x.stroke();
    x.beginPath(); x.moveTo(66, 8); x.lineTo(60, 22); x.lineTo(72, 22); x.closePath(); x.fill();
    x.beginPath(); x.arc(44, 40, 11, 0, 6.29); x.fill();
    x.beginPath(); x.moveTo(44, 52); x.lineTo(30, 108); x.lineTo(58, 108); x.closePath(); x.fill();
    x.lineWidth = 7;
    x.beginPath(); x.moveTo(36, 106); x.lineTo(30, 152); x.stroke();
    x.beginPath(); x.moveTo(52, 106); x.lineTo(58, 152); x.stroke();
    x.beginPath(); x.moveTo(50, 62); x.lineTo(62, 76); x.stroke();
    x.beginPath(); x.ellipse(24, 84, 12, 20, .2, 0, 6.29); x.fill();
    return new THREE.CanvasTexture(c);
  }
  const texA = soldierTex('#e8b34a'), texB = soldierTex('#b03328');
  const p1 = new THREE.PlaneGeometry(1.9, 3.8); p1.rotateY(Math.PI / 4);
  const p2 = new THREE.PlaneGeometry(1.9, 3.8); p2.rotateY(-Math.PI / 4);
  const solGeo = mergeGeometries([p1, p2]);
  const COUNT = 90;
  function hostMesh(tex) {
    return new THREE.InstancedMesh(solGeo, new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: .1, side: THREE.DoubleSide }), COUNT);
  }
  const hostA = hostMesh(texA), hostB = hostMesh(texB);
  root.add(hostA); root.add(hostB);
  const troopsA = [], troopsB = [];
  for (let i = 0; i < COUNT; i++) {
    const frontA = i < 32;
    const xa = frontA ? rand(-6.3, -2.3) : rand(-27, -6.8), za = rand(-36, 36);
    troopsA.push({ x: xa, z: za, gy: groundY(xa, za), p: Math.random() * 6.28, f: frontA ? 1 : .35, s: rand(1.05, 1.28) });
    const frontB = i < 32;
    const xb = frontB ? rand(2.3, 6.3) : rand(6.8, 27), zb = rand(-36, 36);
    troopsB.push({ x: xb, z: zb, gy: groundY(xb, zb), p: Math.random() * 6.28, f: frontB ? 1 : .35, s: rand(1.05, 1.28) });
  }

  const banners = [];
  for (let i = 0; i < 10; i++) {
    const side = i % 2 ? 1 : -1, col = i % 2 ? 0xb03328 : 0xe8b34a;
    const g = new THREE.Group();
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(.12, .12, 7, 5), new THREE.MeshStandardMaterial({ color: 0x2a1a10, roughness: .9 }));
    pole.position.y = 3.5; g.add(pole);
    const cloth = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.4, 6, 3), new THREE.MeshStandardMaterial({ color: col, side: THREE.DoubleSide, roughness: .8, emissive: col, emissiveIntensity: .3 }));
    cloth.position.set(1.25, 6, 0); g.add(cloth);
    const bx = side * rand(3.6, 24.8), bz = rand(-38, 38);
    g.position.set(bx, groundY(bx, bz), bz);
    root.add(g); banners.push({ g, cloth, p: Math.random() * 6.28 });
  }

  const AN = 70;
  const arrows = new THREE.InstancedMesh(new THREE.BoxGeometry(.05, .05, 1.5), new THREE.MeshBasicMaterial({ color: 0x1c0f08 }), AN);
  root.add(arrows);
  const flights = [];
  function newFlight(a) {
    const dir = Math.random() < .5 ? 1 : -1;
    a.x0 = -dir * rand(9, 31); a.x1 = dir * rand(3.6, 27);
    a.z0 = rand(-38, 38); a.z1 = a.z0 + rand(-7, 7);
    a.peak = rand(7, 13); a.T = rand(1.6, 2.6); a.u = Math.random(); a.dir = dir;
  }
  for (let i = 0; i < AN; i++) { const a = {}; newFlight(a); flights.push(a); }

  const E = 200, ep = new Float32Array(E * 3);
  for (let i = 0; i < E; i++) { ep[i*3] = rand(-40, 40); ep[i*3+1] = gy0 + rand(0, 13); ep[i*3+2] = rand(-40, 40); }
  const eGeo = new THREE.BufferGeometry(); eGeo.setAttribute('position', new THREE.BufferAttribute(ep, 3));
  const embers = new THREE.Points(eGeo, new THREE.PointsMaterial({ size: .3, color: 0xffa64d, map: softDot, transparent: true, opacity: .85, blending: THREE.AdditiveBlending, depthWrite: false }));
  root.add(embers);

  const fires = [];
  for (let i = 0; i < 6; i++) {
    const f = new THREE.Sprite(new THREE.SpriteMaterial({ map: softDot, color: 0xff8c3a, transparent: true, opacity: .8, blending: THREE.AdditiveBlending, depthWrite: false }));
    f.scale.setScalar(rand(2.5, 4));
    const fx = rand(-1, 1) * rand(3, 9), fz = rand(-31, 3.6);
    f.position.set(fx, groundY(fx, fz) + 1.2, fz);
    root.add(f); fires.push({ f, p: Math.random() * 6.28 });
  }

  const cmdX = 1.1, cmdZ = 7.2, cmdGY = groundY(cmdX, cmdZ);
  const cmd = new THREE.Mesh(solGeo, new THREE.MeshBasicMaterial({ map: texA, transparent: true, alphaTest: .1, side: THREE.DoubleSide }));
  cmd.scale.setScalar(1.7); cmd.position.set(cmdX, cmdGY + 2.9, cmdZ); root.add(cmd);
  const cmdGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: softDot, color: 0xffc35c, transparent: true, opacity: .35, blending: THREE.AdditiveBlending, depthWrite: false }));
  cmdGlow.scale.setScalar(5); cmdGlow.position.set(cmdX, cmdGY + 3.2, cmdZ + .5); root.add(cmdGlow);

  const beats = [
    { x: cmdX, z: cmdZ, r: 3.5, fired: false, line: 'steady, friend. the line holds because we hold it.' },
    { x: 0, z: -0.9, r: 3, fired: false, line: 'the horns! brace - the hosts meet!' },
    { x: 0, z: -23.4, r: 4, fired: false, line: 'from this ridge you can see both hosts entire. remember this sight.' },
  ];

  return {
    update(dt, t) {
      for (let i = 0; i < COUNT; i++) {
        let a = troopsA[i], b = troopsB[i];
        const luA = Math.max(0, Math.sin(t * 1.9 + a.p)) * 1.6 * a.f;
        const luB = Math.max(0, Math.sin(t * 1.9 + b.p + 2.2)) * 1.6 * b.f;
        setInst(hostA, i, a.x + luA, a.gy + 1.9 * a.s + Math.abs(Math.sin(t * 6 + a.p)) * .12, a.z, Math.sin(t * 3 + a.p) * .15, a.s);
        setInst(hostB, i, b.x - luB, b.gy + 1.9 * b.s + Math.abs(Math.sin(t * 6 + b.p)) * .12, b.z, Math.sin(t * 3 + b.p) * .15, b.s);
      }
      hostA.instanceMatrix.needsUpdate = true; hostB.instanceMatrix.needsUpdate = true;
      for (let i = 0; i < AN; i++) {
        const a = flights[i]; a.u += dt / a.T; if (a.u > 1) newFlight(a);
        const u = a.u, x = a.x0 + (a.x1 - a.x0) * u, z = a.z0 + (a.z1 - a.z0) * u, y = gy0 + 2 + a.peak * 4 * u * (1 - u);
        EU.set(0, Math.atan2(a.x1 - a.x0, a.z1 - a.z0), (1 - 2 * u) * .9); Q.setFromEuler(EU);
        V.set(x, y, z); S.set(1, 1, 1); M.compose(V, Q, S); arrows.setMatrixAt(i, M);
      }
      arrows.instanceMatrix.needsUpdate = true;
      for (const b of banners) {
        const posA = b.cloth.geometry.attributes.position;
        for (let vi = 0; vi < posA.count; vi++) {
          const vx = posA.getX(vi);
          posA.setZ(vi, Math.sin(t * 5 + b.p + vx * 2) * .18 * (vx + 1.2) / 2.4);
        }
        posA.needsUpdate = true;
      }
      const pa = embers.geometry.attributes.position;
      for (let i = 0; i < E; i++) { let y = pa.getY(i) + dt * (1.2 + (i % 5) * .3); if (y > gy0 + 14) y = gy0; pa.setY(i, y); pa.setX(i, pa.getX(i) + Math.sin(t + i) * dt * .4); }
      pa.needsUpdate = true;
      for (const fr of fires) { fr.f.material.opacity = .55 + .3 * Math.abs(Math.sin(t * 7 + fr.p)); fr.f.scale.setScalar(fr.f.scale.x * (0.97 + 0.06 * Math.abs(Math.sin(t * 9 + fr.p)))); }
      cmdGlow.material.opacity = .28 + .1 * Math.sin(t * 2.2);
      if (charData && charData.name === 'commander rye') {
        for (const bt of beats) {
          if (!bt.fired && Math.hypot(pos.x - bt.x, pos.z - bt.z) < bt.r) { bt.fired = true; addMsg(bt.line, 'char', 'commander rye'); }
        }
      }
    }
  };
}

/* ---------------- marble: real generation + splat worlds ---------------- */
const MARBLE_WORKER = 'https://dreamworld-marble-proxy.sabbi-vikas.workers.dev';
const MOCK_SPLAT = 'https://sparkjs.dev/assets/splats/butterfly.spz';
const FORCE_MOCK = new URLSearchParams(location.search).has('mock') || location.hash.includes('mock');
const TEST_BATTLE = new URLSearchParams(location.search).has('testbattle');
const TEST_SPZ = MARBLE_WORKER + '/asset?url=' + encodeURIComponent('https://cdn.marble.worldlabs.ai/86c9176a-9019-40e1-90a0-7aea5d0e55a3/069ab923-379d-482c-bba5-d7c9c9f0f989_sand_500k.spz');
const TEST_COL = MARBLE_WORKER + '/asset?url=' + encodeURIComponent('https://cdn.marble.worldlabs.ai/86c9176a-9019-40e1-90a0-7aea5d0e55a3/4d59a32d.glb');
let splatMesh = null, splatMode = false, currentGenre = null, splatMaxR = 30, splatGroundFn = null;

const STORY = [
  { keys: ['battle','war','army','armies','siege','clash','legion','battlefield'],
    char: { name: 'commander rye',
      hi: 'you picked a loud day to visit. the legion forms up at dusk - walk the field while you can.',
      replies: ['the eastern ridge holds the best view of the clash.','steel yourself. when the horns sound, the whole valley answers.'] } },
];
function pickStory(text, genre) {
  const t = (text || '').toLowerCase();
  for (const st of STORY) if (st.keys.some(k => t.includes(k))) return st.char;
  return CHARACTERS[genre] || null;
}

async function marbleGenerate(prompt, onTick) {
  if (FORCE_MOCK) {
    for (let i = 0; i < 5; i++) { onTick(i * 3); await new Promise(r => setTimeout(r, 3000)); }
    return { spz: MOCK_SPLAT, viewer: '' };
  }
  const r = await fetch(MARBLE_WORKER + '/generate', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) });
  if (!r.ok) throw new Error('generate ' + r.status);
  const { operation_id } = await r.json();
  const t0 = Date.now();
  while (Date.now() - t0 < 8 * 60 * 1000) {
    await new Promise(r => setTimeout(r, 5000));
    onTick((Date.now() - t0) / 1000);
    const s = await (await fetch(MARBLE_WORKER + '/status/' + operation_id)).json();
    if (s.error) throw new Error(s.error);
    if (s.done) {
      const urls = s.assets && s.assets.splats && s.assets.splats.spz_urls || {};
      const spz = urls['500k'] || urls['100k'] || urls.full_res;
      if (!spz) throw new Error('no splat in result');
      const col = s.assets && s.assets.mesh && s.assets.mesh.collider_mesh_url;
      const prox = u => /worldlabs/.test(u) ? MARBLE_WORKER + '/asset?url=' + encodeURIComponent(u) : u;
      return { spz: prox(spz), viewer: s.viewer_url || '', collider: col ? prox(col) : null };
    }
  }
  throw new Error('timeout');
}

async function enterSplatWorld(spzUrl, label, opts) {
  opts = opts || {};
  if (splatMesh) { scene.remove(splatMesh); splatMesh.dispose && splatMesh.dispose(); splatMesh = null; }
  if (root) { scene.remove(root); root.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
  const spark = await import('@sparkjsdev/spark');
  splatMesh = new spark.SplatMesh({ url: spzUrl });
  scene.add(splatMesh);
  root = new THREE.Group(); scene.add(root);
  current = null; flyMode = false; splatMode = true;
  scene.fog = null; scene.background = new THREE.Color(0x0b0e1a);
  currentGenre = opts.battle ? 'battle' : null;
  if (!opts.battle) stopWarAudio();
  splatMaxR = opts.battle ? 40 : 30;
  yaw = 0; pitch = 0; intro = .6;
  document.getElementById('world-name').textContent = label || 'your world';
  let groundY = null;
  if (opts.collider) {
    try {
      const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
      const gltf = await new GLTFLoader().loadAsync(opts.collider);
      const colScene = gltf.scene;
      const bbox = new THREE.Box3().setFromObject(colScene);
      const dim = Math.max(bbox.max.x - bbox.min.x, bbox.max.z - bbox.min.z);
      const S = dim > .1 ? Math.min(10, Math.max(1, 64 / dim)) : 1;
      const ox = -S * (bbox.min.x + bbox.max.x) / 2, oz = -S * (bbox.min.z + bbox.max.z) / 2;
      colScene.scale.setScalar(S); colScene.position.set(ox, 0, oz); colScene.updateMatrixWorld(true);
      splatMesh.scale.setScalar(S); splatMesh.position.set(ox, 0, oz);
      const rc = new THREE.Raycaster(), DOWN = new THREE.Vector3(0, -1, 0), ORG = new THREE.Vector3();
      groundY = (x, z) => { ORG.set(x, 500, z); rc.set(ORG, DOWN); const h = rc.intersectObject(colScene, true); return h.length ? h[0].point.y : 0; };
      splatGroundFn = groundY;
    } catch (e) { console.warn('collider unavailable, flat ground:', e); }
  }
  if (!groundY) { groundY = () => 0; splatGroundFn = null; }
  if (opts.battle) {
    const gy0 = groundY(0, 14);
    pos.set(0, gy0 + 1.7, 14);
    current = buildBattleOnSplat(root, groundY, gy0);
  } else {
    pos.set(0, groundY(0, 4) + 1.7, 4);
  }
}

/* ---------------- character chat ---------------- */
const CHARACTERS = {
  city:   { name:'connor', hi:'well well. a new face in the rain. what brings you to my city?',
            replies:['stick around - the neon looks better with someone to show it to.','go wander. i\u2019ll be here under the lights.'] },
  forest: { name:'fern', hi:'oh! a visitor. the fireflies haven\u2019t stopped talking about you.',
            replies:['the grove likes you. i can tell.','follow the lights - they\u2019re friendlier than they look.'] },
  ocean:  { name:'marina', hi:'a surface-dweller, all the way down here? lucky me.',
            replies:['the coral glows brighter when someone new swims by.','drift slow. the reef shows off when you\u2019re patient.'] },
  desert: { name:'sable', hi:'careful where you step - these stones are older than empires.',
            replies:['you\u2019ve got the look of someone who finds things.','the gold\u2019s brightest at the far arch. go see.'] },
  space:  { name:'nova', hi:'signal locked. you made it further out than most.',
            replies:['the nebula hums if you float still long enough.','no wrong direction out here. drift on.'] },
};
const EXTRA_LINES = ['the world\u2019s yours. wander.','i\u2019m not going anywhere. go look at everything.'];
CHARACTERS.battle = { name: 'commander rye',
  hi: 'you picked a loud day to visit. the legion forms up at dusk - walk the field while you can.',
  replies: ['the eastern ridge holds the best view of the clash.','steel yourself. when the horns sound, the whole valley answers.'] };
let charData = null, replyIdx = 0, extraIdx = 0, greetTimer = null;
const chatlog = document.getElementById('chatlog');
function addMsg(text, cls, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  if (who) { const w = document.createElement('span'); w.className = 'who'; w.textContent = who; div.appendChild(w); }
  div.appendChild(document.createTextNode(text));
  chatlog.appendChild(div);
  while (chatlog.children.length > 3) chatlog.removeChild(chatlog.firstChild);
}
function resetChat() {
  chatlog.innerHTML = ''; replyIdx = 0; extraIdx = 0;
  clearTimeout(greetTimer);
}
document.getElementById('chatbar').addEventListener('submit', (e) => {
  e.preventDefault();
  const inp = document.getElementById('chat-input');
  const t = inp.value.trim(); if (!t || !charData) return;
  inp.value = ''; inp.blur();
  addMsg(t, 'me');
  setTimeout(() => {
    const line = replyIdx < charData.replies.length ? charData.replies[replyIdx++] : EXTRA_LINES[extraIdx++ % EXTRA_LINES.length];
    addMsg(line, 'char', charData.name);
  }, 650);
});

/* ---------------- UI wiring ---------------- */
const HERO_BATTLE = 'a mythic battlefield at golden dusk - two hosts, ten thousand banners, embers on the wind';
const HERO_FOREST = 'an enchanted forest glowing at dusk - fireflies, god-rays, ancient light';
const CHIPS = [HERO_BATTLE, HERO_FOREST,
  'a neon city where it never stops raining',
  'the lost city of atlantis, glowing coral',
  'golden ruins in a desert sunset',
  'drifting through a violet nebula',
];
// hero worlds: baked full-quality marble chips (no per-tap generation cost)
const FIXED_WORLDS = {
  [HERO_BATTLE]: { spz: "https://dreamworld-marble-proxy.sabbi-vikas.workers.dev/asset?url=https%3A%2F%2Fcdn.marble.worldlabs.ai%2F26cd9141-9c4d-4feb-8bb7-dc3c8f5c266f%2F6094e206-b73c-4459-99c4-c95a2f877c01_ceramic_500k.spz", col: "https://dreamworld-marble-proxy.sabbi-vikas.workers.dev/asset?url=https%3A%2F%2Fcdn.marble.worldlabs.ai%2F26cd9141-9c4d-4feb-8bb7-dc3c8f5c266f%2F8c73daa0.glb", battle: true },
  [HERO_FOREST]: { spz: "https://dreamworld-marble-proxy.sabbi-vikas.workers.dev/asset?url=https%3A%2F%2Fcdn.marble.worldlabs.ai%2F853764d6-0993-4dc8-b212-a9f1cd2f5b77%2Fed22d622-9cbf-4fbe-8426-6e514f58122a_ceramic_500k.spz", col: "https://dreamworld-marble-proxy.sabbi-vikas.workers.dev/asset?url=https%3A%2F%2Fcdn.marble.worldlabs.ai%2F853764d6-0993-4dc8-b212-a9f1cd2f5b77%2Fc1427893.glb", battle: false },
};
const chipsEl = document.getElementById('chips');
for (const label of CHIPS) {
  const b = document.createElement('button');
  b.className = 'chip'; b.type = 'button'; b.textContent = label;
  b.onclick = () => { document.getElementById('dream-input').value = label; begin(label); };
  chipsEl.appendChild(b);
}

const landing = document.getElementById('landing'), veil = document.getElementById('veil'), hud = document.getElementById('hud');
const hint = document.getElementById('hint');
hint.textContent = isTouch ? 'drag to look  ·  left thumb to wander' : 'drag to look  ·  WASD to wander';
document.getElementById('dream-form').addEventListener('submit', (e) => { e.preventDefault();
  begin(document.getElementById('dream-input').value); });
document.getElementById('again-btn').addEventListener('click', () => {
  hud.classList.remove('on'); started = false; resetChat(); charData = null;
  landing.classList.remove('gone');
  document.getElementById('dream-input').value = '';
  setTimeout(() => document.getElementById('dream-input').focus(), 500);
});

let hintTimer = null;
function begin(text) {
  const dream = (text || '').trim() || 'somewhere impossible';
  const genre = classify(dream);
  const storyChar = pickStory(dream, genre);
  veil.classList.add('on');
  const vt = document.getElementById('veil-text');
  vt.textContent = 'weaving "' + (dream.length > 34 ? dream.slice(0, 34) + '\u2026' : dream) + '"';
  const reveal = () => {
    veil.classList.remove('on');
    hud.classList.add('on');
    clearTimeout(hintTimer);
    hint.classList.remove('gone');
    hintTimer = setTimeout(() => hint.classList.add('gone'), 5200);
    resetChat(); charData = storyChar;
    if (charData) greetTimer = setTimeout(() => addMsg(charData.hi, 'char', charData.name), 2200);
  };
  (async () => {
    let usedMarble = false;
    try {
      const fixed = FIXED_WORLDS[dream];
      if (fixed) {
        await enterSplatWorld(fixed.spz, dream.slice(0, 24), { battle: fixed.battle, collider: fixed.col });
        usedMarble = true;
        throw 'skip-normal';
      }
      if (TEST_BATTLE) {
        await enterSplatWorld(TEST_SPZ, 'battle over marble splat', { battle: true, collider: TEST_COL });
        usedMarble = true;
        throw 'skip-normal';
      }
      const res = await marbleGenerate(dream, (el) => {
        vt.textContent = 'weaving your world\u2026 ' + Math.round(el) + 's - real generation takes a few minutes';
      });
      await enterSplatWorld(res.spz, dream.slice(0, 24), { battle: genre === 'battle' || (storyChar && storyChar.name === 'commander rye'), collider: res.collider });
      usedMarble = true;
    } catch (e) {
      if (e !== 'skip-normal') console.warn('marble path unavailable, prebaked fallback:', e);
    }
    if (!usedMarble) {
      await new Promise(r => setTimeout(r, 650));
      enterWorld(genre);
      await new Promise(r => setTimeout(r, 1050));
    }
    started = true;
    landing.classList.add('gone');
    reveal();
  })();
}

if (TEST_BATTLE) setTimeout(() => begin('an epic battlefield at dusk, banners catching fire'), 500);
